name: Read-only AI discovery access audit
on:
  push:
    branches: [feat/ai-discovery-20260917]
    paths: [.github/workflows/ai-discovery-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bounded GET requests; user-agent simulation is not crawler verification
        run: |
          mkdir -p /tmp/ai-discovery-audit
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error, time, datetime
          out=pathlib.Path('/tmp/ai-discovery-audit')
          rows=[]
          agents=['AussieWHVCompassAudit/1.0','ClaudeBot','Claude-SearchBot','Claude-User']
          for agent in agents:
            for path in ['/robots.txt','/','/free.html','/llms.txt','/sitemap.xml']:
              url='https://www.aussiewhvcompass.com'+path
              req=urllib.request.Request(url,headers={'User-Agent':agent,'Accept':'text/html,text/plain,application/xml;q=0.9,*/*;q=0.5'})
              try:
                r=urllib.request.urlopen(req,timeout=15)
              except urllib.error.HTTPError as e:
                r=e
              except Exception as e:
                rows.append({'agent':agent,'url':url,'error':str(e)});continue
              with r:
                body=r.read(1048576)
                row={'agent':agent,'url':url,'finalUrl':r.url,'status':r.status,'bytes':len(body),'contentType':r.headers.get('Content-Type'),'cfMitigated':r.headers.get('cf-mitigated'),'cfRay':r.headers.get('cf-ray'),'server':r.headers.get('server')}
                rows.append(row)
                if path=='/robots.txt':out.joinpath(agent.replace('/','_')+'-robots.txt').write_bytes(body)
              time.sleep(0.3)
          for host in ['https://aussiewhvcompass.com','http://aussiewhvcompass.com','http://www.aussiewhvcompass.com']:
            try:
              with urllib.request.urlopen(urllib.request.Request(host+'/robots.txt',headers={'User-Agent':agents[0]}),timeout=15) as r:
                body=r.read(1048576);rows.append({'agent':agents[0],'url':host+'/robots.txt','finalUrl':r.url,'status':r.status,'contentType':r.headers.get('Content-Type'),'bytes':len(body)})
            except Exception as e:rows.append({'url':host+'/robots.txt','error':str(e)})
          report={'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'limitations':'Simulated user-agent requests from a GitHub runner; NOT verified Anthropic IPs, Cloudflare Security Events, indexing, or actual Claude fetch evidence. No non-GET requests.','requests':rows}
          out.joinpath('access.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-discovery-access-before
          path: /tmp/ai-discovery-audit
          retention-days: 7
