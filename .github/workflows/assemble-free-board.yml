name: Assemble and verify free board
on:
  push:
    branches: [feat/free-board-20260916]
permissions: {}
concurrency:
  group: assemble-free-board
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Integrate feature without replacing existing sections
        run: |
          mkdir -p /tmp/free-board-qa
          python scripts/assemble_free_board.py
      - name: Syntax, regression and generated artifact checks
        run: |
          set -o pipefail
          node --check assets/free-board.js
          node --test scripts/test_free_board.cjs scripts/test_map_postcode_regression.cjs | tee /tmp/free-board-qa/unit-tests.txt
          python scripts/build_i18n.py --check
          python scripts/build_seo.py --check
          python scripts/build_search.py --check
          node scripts/test_analytics.cjs
          node scripts/test_housing_search.mjs
          node scripts/test_job_router.mjs
          node scripts/test_search.mjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix /tmp/board-browser playwright@1.55.0
          /tmp/board-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Desktop, mobile, no-JS and safe rendering browser checks
        env:
          NODE_PATH: /tmp/board-browser/node_modules
          QA_DIR: /tmp/free-board-qa
        run: node scripts/test_free_board_browser.cjs
      - name: Register board-specific moderation labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create free-board --color 316B52 --description 'Free giveaway submitted; website display requires separate review' --force
          gh label create free-board-approved --color 24834D --description 'Reviewed for board rules; not identity or product safety verification' --force
          gh label create free-board-reserved --color B08825 --description 'Reserved; confirm availability on the original issue' --force
      - name: Commit verified integration to this feature branch only
        run: |
          rm scripts/assemble_free_board.py scripts/free-board-fragment.html .github/workflows/assemble-free-board.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add free.html
          git diff --cached --check
          git diff --cached --stat > /tmp/free-board-qa/integration-stat.txt
          git diff --cached > /tmp/free-board-qa/integration.patch
          git commit -m 'feat(P1-24): integrate reviewed free-giveaway board and verified site entries'
          git push origin HEAD:feat/free-board-20260916
      - name: Retain test evidence and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: free-board-qa
          path: /tmp/free-board-qa
          retention-days: 7
