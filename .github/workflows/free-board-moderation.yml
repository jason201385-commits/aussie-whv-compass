name: Free board review guard
on:
  issues:
    types: [edited]
permissions: {}
jobs:
  require-review:
    if: contains(github.event.issue.labels.*.name, 'free-board-approved')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove approval after an edit (no checkout or user code execution)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api --method DELETE "repos/$GH_REPO/issues/$ISSUE_NUMBER/labels/free-board-approved"
