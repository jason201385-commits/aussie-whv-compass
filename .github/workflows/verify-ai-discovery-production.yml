name: Read-only production AI discovery verification
on:
  push:
    branches: [qa/ai-discovery-production-20260917]
    paths: [.github/workflows/verify-ai-discovery-production.yml]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce0b8338b08f586b81d2e42d1e6778a717d27e47
          persist-credentials: false
      - name: Read all public formats and retain strict HTML difference evidence
        run: |
          mkdir -p /tmp/ai-discovery-production
          python - <<'PY'
          import pathlib,json,hashlib,urllib.request,urllib.error,datetime,time,re,difflib
          from urllib.parse import urlsplit
          from urllib.robotparser import RobotFileParser
          from html.parser import HTMLParser
          root=pathlib.Path('.')
          out=pathlib.Path('/tmp/ai-discovery-production')
          origin='https://www.aussiewhvcompass.com'
          manifest=json.loads(root.joinpath('ai-index.json').read_text())
          rows=[]; errors=[]
          class Head(HTMLParser):
            def __init__(self):
              super().__init__();self.canonical=[];self.robots=[];self.alternates=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='link' and d.get('rel')=='canonical':self.canonical.append(d.get('href'))
              if tag=='link' and d.get('type')=='text/markdown':self.alternates.append(d.get('href'))
              if tag=='meta' and d.get('name','').lower()=='robots':self.robots.append(d.get('content',''))
          def check(path,agent,doc=None):
            url=origin+path
            row={'url':url,'userAgent':agent,'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':agent,'Accept':'text/html,text/markdown,text/plain,application/json,application/xml;q=0.9,*/*;q=0.5'})
              try:r=urllib.request.urlopen(req,timeout=20)
              except urllib.error.HTTPError as e:r=e
              with r:
                data=r.read(2000001);ct=r.headers.get('Content-Type','')
                row.update(status=r.status,finalUrl=r.geturl(),contentType=ct,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),cfMitigated=r.headers.get('cf-mitigated'),xRobotsTag=r.headers.get('X-Robots-Tag'),server=r.headers.get('Server'),cfRay=r.headers.get('cf-ray'),cache=r.headers.get('CF-Cache-Status'))
              assert len(data)<=2000000,'response exceeded bound'
              assert row['status']==200,('HTTP',row['status'])
              assert row['cfMitigated']!='challenge','challenge response'
              assert 'noindex' not in (row['xRobotsTag'] or '').lower(),'X-Robots-Tag noindex'
              source_path=path.lstrip('/')
              if not source_path or source_path.endswith('/'):source_path+='index.html'
              source=root.joinpath(source_path).read_bytes()
              row['rawExact']=data==source
              if doc:
                assert ct.startswith('text/html'),ct
                text=data.decode('utf-8');original=source.decode('utf-8')
                before=re.search(r'<main\b[\s\S]*?</main>',original)
                after=re.search(r'<main\b[\s\S]*?</main>',text)
                row['mainExact']=bool(before and after and before.group()==after.group())
                a=Head();a.feed(text)
                row['canonicalCorrect']=a.canonical==[doc['canonicalUrl']]
                row['alternateCorrect']=doc['markdownUrl'] in a.alternates
                row['noIndex']=any('noindex' in x.lower() for x in a.robots)
                row['readingFooterPresent']='<!-- AI_READING_FOOTER_BEGIN -->' in text
                assert row['canonicalCorrect'],'wrong canonical'
                assert row['alternateCorrect'],'missing reading alternate'
                assert row['readingFooterPresent'],'missing reading footer'
                assert not row['noIndex'],'meta robots noindex'
                if not row['rawExact']:
                  key=source_path.replace('/','__')
                  out.joinpath(key+'.original').write_bytes(source)
                  out.joinpath(key+'.served').write_bytes(data)
                  diff=''.join(difflib.unified_diff(original.splitlines(True),text.splitlines(True),fromfile='source/'+source_path,tofile='served/'+source_path,n=2))
                  out.joinpath(key+'.diff').write_text(diff)
                  row['diffFile']=key+'.diff'
                  row['lineEndingOnly']=original.replace('\r\n','\n')==text.replace('\r\n','\n')
                  row['injectedScriptSources']=re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text)
              else:
                assert row['rawExact'],'published reading bytes differ'
                if path.endswith('.md'):assert ct.startswith(('text/plain','text/markdown')),ct
                if path.endswith('.json'):assert 'application/json' in ct,ct
                if path=='/robots.txt':
                  parser=RobotFileParser();parser.parse(data.decode().splitlines())
                  checks={}
                  for bot in ['Claude-SearchBot','Claude-User','ClaudeBot']:
                    checks[bot]={'public':all(parser.can_fetch(bot,origin+p) for p in ['/','/free.html','/ai/visa.md','/llms.txt']), 'privateExcluded':all(not parser.can_fetch(bot,origin+p) for p in ['/api/private','/admin/','/crm/','/contact/receipt/test'])}
                  row['robotsChecks']=checks
                  assert all(x['public'] and x['privateExcluded'] for x in checks.values()),checks
            except Exception as e:
              row['error']=str(e);errors.append({'url':url,'userAgent':agent,'error':str(e)})
            rows.append(row)
            out.joinpath('requests.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
            time.sleep(.2)
          for doc in manifest['documents']:check(urlsplit(doc['markdownUrl']).path,'AussieWHVCompassVerification/1.0')
          for path in ['/ai-index.json','/llms.txt','/llms-full.txt','/robots.txt','/sitemap.xml']:check(path,'AussieWHVCompassVerification/1.0')
          for doc in manifest['documents']:check(urlsplit(doc['canonicalUrl']).path,'AussieWHVCompassVerification/1.0',doc)
          for agent in ['ClaudeBot','Claude-SearchBot','Claude-User']:
            for path in ['/robots.txt','/llms.txt','/ai-index.json','/ai/visa.md','/ai/free.md']:check(path,agent)
            check('/index.html',agent,manifest['documents'][0])
          html_rows=[x for x in rows if 'mainExact' in x]
          report={'productionCommit':'ce0b8338b08f586b81d2e42d1e6778a717d27e47','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':len(rows),'http200':sum(x.get('status')==200 for x in rows),'readingDocuments':len(manifest['documents']),'htmlChecked':len(html_rows),'htmlRawExact':sum(x['rawExact'] for x in html_rows),'htmlMainExact':sum(x['mainExact'] for x in html_rows),'errors':errors,'htmlDiffs':[{'url':x['url'],'agent':x['userAgent'],'mainExact':x['mainExact'],'diffFile':x.get('diffFile')} for x in html_rows if not x['rawExact']],'limitations':'GET-only compatibility probes from a GitHub runner, not verified Anthropic traffic or indexing evidence. Raw HTML differences are retained for diagnosis, NOT silently considered equivalent. No production, Cloudflare, Supabase, posting or authentication writes.'}
          out.joinpath('result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert not errors,'HTTP/reading/discovery errors; inspect artifact'
          PY
      - name: Install isolated browser dependency
        if: always()
        run: |
          npm install --prefix /tmp/ai-prod-browser playwright@1.55.0
          /tmp/ai-prod-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify native reading links without JavaScript on the live site
        if: always()
        env:
          NODE_PATH: /tmp/ai-prod-browser/node_modules
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch();const checks=[];
            try {
              for(const width of [390,1280]) {
                const context=await browser.newContext({viewport:{width,height:844},javaScriptEnabled:false});
                await context.route('**/*',route=>{
                  const req=route.request();const u=new URL(req.url());
                  return req.method()==='GET'&&u.origin==='https://www.aussiewhvcompass.com'?route.continue():route.abort();
                });
                const page=await context.newPage();
                for(const [path,md] of [['/','/ai/index.md'],['/free.html','/ai/free.md'],['/lang/en/visa/','/ai/en/visa.md']]) {
                  const response=await page.goto('https://www.aussiewhvcompass.com'+path,{waitUntil:'domcontentloaded'});
                  assert.equal(response.status(),200);
                  const link=page.locator('footer a[href="https://www.aussiewhvcompass.com'+md+'"]');
                  assert.equal(await link.count(),1);
                  await link.scrollIntoViewIfNeeded();assert(await link.isVisible());
                  assert(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'horizontal overflow');
                  assert.equal(await page.locator('head link[rel="alternate"][type="text/markdown"][href="https://www.aussiewhvcompass.com'+md+'"]').count(),1);
                  checks.push({path,width,noJavaScript:true,readingLink:md});
                  fs.writeFileSync('/tmp/ai-discovery-production/browser-result.json',JSON.stringify({passed:checks.length,checks,limitations:'Read-only live pages with JavaScript disabled and third-party requests blocked; not physical-device, real crawler or indexing verification.'},null,2));
                  if(path==='/free.html')await page.screenshot({path:'/tmp/ai-discovery-production/free-footer-'+width+'.png'});
                }
                await context.close();
              }
            }finally{await browser.close();}
            console.log('Production no-JavaScript reading-link groups passed:',checks.length);
          })().catch(err=>{console.error(err);process.exit(1);});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-discovery-production-qa
          path: /tmp/ai-discovery-production
          retention-days: 7
