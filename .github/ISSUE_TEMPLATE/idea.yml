name: 內容許願與建議
description: 覺得少了什麼主題、哪個工具可以更好用？告訴我們。
title: "[許願] "
labels: ["許願池"]
body:
  - type: markdown
    attributes:
      value: |
        這會建立一則公開 GitHub Issue，並連同你的 GitHub 帳號顯示。請勿留下個資，也不要上傳含有真實姓名、聯絡方式、護照／簽證號碼、薪資單、合約、對話截圖、可識別雇主或第三人的內容。
  - type: dropdown
    id: kind
    attributes:
      label: 這是什麼類型的建議？
      options:
        - 想要新的主題或頁面
        - 現有內容可以寫得更好
        - 互動工具的改善
        - 網站設計與使用體驗
        - 其他
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 說說你的想法
      placeholder: 例：希望有各州採收季節的月曆對照表。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 你的情境（選填）
      placeholder: 例：我正在規劃明年 3 月出發，發現……
