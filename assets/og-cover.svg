<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">澳打指南針社群分享圖</title>
  <desc id="desc">淡藍與奶油直條紋上有手繪檸檬，中央寫著澳打指南針與澳洲打工度假開源攻略。</desc>
  <defs>
    <pattern id="stripes" width="104" height="104" patternUnits="userSpaceOnUse">
      <rect width="52" height="104" fill="#d9e7ec"/>
      <rect x="52" width="52" height="104" fill="#fffaf0"/>
    </pattern>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#42534a" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#stripes)"/>
  <rect width="1200" height="630" fill="#f6f0df" opacity=".22" filter="url(#paper)"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(45 38) rotate(-9 130 88)">
      <path d="M36 98C49 42 112 12 176 29c55 15 77 68 43 109-39 47-121 51-166 14-24-20-31-38-17-54Z" fill="#f1cd57" stroke="#ad8d28" stroke-width="5"/>
      <path d="M185 32c24-33 62-38 84-14-17 32-51 44-84 14Z" fill="#647468" stroke="#39483f" stroke-width="5"/>
      <path d="M183 34c14-9 28-17 43-27" fill="none" stroke="#4e5d53" stroke-width="7"/>
    </g>
    <g transform="translate(925 398) rotate(9 110 78)">
      <path d="M31 88C44 38 101 13 158 28c50 13 70 61 39 98-35 42-109 46-149 13-22-18-28-35-17-51Z" fill="#efc84c" stroke="#ad8d28" stroke-width="5"/>
      <path d="M163 30c21-30 56-34 75-13-15 29-46 40-75 13Z" fill="#56675b" stroke="#39483f" stroke-width="5"/>
      <path d="M161 32c12-8 25-15 38-24" fill="none" stroke="#4e5d53" stroke-width="7"/>
    </g>
    <g transform="translate(1030 85) rotate(14 63 63)">
      <path d="M63 13a51 51 0 1 1-36 86Z" fill="#f4d66e" stroke="#bd9d31" stroke-width="5"/>
      <path d="M63 13 27 99M63 13v101M63 13l39 83" fill="none" stroke="#c7a735" stroke-width="4"/>
    </g>
    <g transform="translate(38 480) rotate(-16 88 50)">
      <path d="M15 57C43 20 105 9 151 31 125 72 63 84 15 57Z" fill="#647468" stroke="#39483f" stroke-width="5"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="218" y="132" width="764" height="366" rx="54" fill="#fffdf5" stroke="#56675b" stroke-width="3"/>
  </g>
  <g text-anchor="middle" fill="#253c34" font-family="'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif">
    <text x="600" y="244" font-size="34" font-weight="700" letter-spacing="8" fill="#b45a2a">AUSSIE WHV COMPASS</text>
    <text x="600" y="345" font-size="76" font-weight="900">澳打指南針</text>
    <path d="M402 382H798" stroke="#efc84c" stroke-width="12" stroke-linecap="round"/>
    <text x="600" y="438" font-size="34" font-weight="700">澳洲打工度假開源攻略</text>
    <text x="600" y="476" font-size="22" font-weight="500" fill="#56675b">官方來源・在地工具・永久免費</text>
  </g>
</svg>
